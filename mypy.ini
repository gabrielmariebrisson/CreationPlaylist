[mypy]
# Configuration MyPy pour le projet CreationPlaylist
# Configuration progressive pour permettre une migration vers un typage strict

# Fichiers et dossiers à vérifier
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Options d'import
ignore_missing_imports = True
follow_imports = normal
follow_imports_for_stubs = False
explicit_package_bases = True

# Options de compatibilité
show_error_codes = True
show_column_numbers = True
pretty = True

# Désactiver certaines vérifications strictes pour compatibilité avec bibliothèques externes
no_implicit_reexport = False
allow_untyped_calls = True
allow_untyped_defs = True
allow_incomplete_defs = True

# Exclusions pour fichiers avec beaucoup d'erreurs de type Any (bibliothèques externes)
[mypy-spotipy.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

# Exclusions (si nécessaire pour des fichiers spécifiques)
# [mypy-tests.*]
# ignore_errors = True
