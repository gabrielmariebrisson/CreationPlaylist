name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # Permet de déclencher manuellement

env:
  PYTHON_VERSION: '3.10'
  POETRY_VERSION: '1.6.0'

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black mypy ruff types-requests types-python-dateutil
      
      - name: Run Black (code formatting)
        run: |
          black --check --diff src/ tests/ || (echo "❌ Code formatting issues found. Run 'black src/ tests/' to fix." && exit 1)
      
      - name: Run Ruff (linting)
        run: |
          ruff check src/ tests/ --output-format=github
      
      - name: Run MyPy (type checking)
        run: |
          mypy src/ --ignore-missing-imports --no-strict-optional || true
        continue-on-error: true  # MyPy peut être strict, on continue même en cas d'erreur

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt
      
      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install safety
        run: |
          python -m pip install --upgrade pip
          pip install safety
      
      - name: Run safety check
        run: |
          safety check --json --file requirements.txt || true
        continue-on-error: true
      
      - name: Run Bandit (security linting)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30
        if: always()

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt
      
      - name: Run integration tests
        run: |
          pytest tests/ -v -m integration || echo "No integration tests found"
        continue-on-error: true
      
      - name: Check imports
        run: |
          python -c "from src.services.spotify_service import SpotifyService; print('✅ Import successful')"
          python -c "from src.models.audio_classifier import AudioClassifier; print('✅ Import successful')"
          python -c "from src.logic.playlist_generator import PlaylistPathfinder; print('✅ Import successful')"
          python -c "from src.services.spotify_service_async import AsyncSpotifyService; print('✅ Import successful')"

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Verify application structure
        run: |
          python -c "import src; print('✅ src package importable')"
          python -c "import src.services; print('✅ services package importable')"
          python -c "import src.models; print('✅ models package importable')"
          python -c "import src.logic; print('✅ logic package importable')"
          python -c "import src.utils; print('✅ utils package importable')"
      
      - name: Check configuration
        run: |
          python -c "from src.config import *; print('✅ Configuration importable')"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, test, security, integration-test, build-check]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          echo "All jobs completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Integration: ${{ needs.integration-test.result }}"
          echo "Build: ${{ needs.build-check.result }}"

