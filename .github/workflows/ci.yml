name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # Permet de déclencher manuellement

env:
  PYTHON_VERSION: '3.10'
  POETRY_VERSION: '1.6.0'

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black mypy ruff types-requests types-python-dateutil

      - name: Run Black (code formatting)
        run: |
          black --check --diff src/ tests/ CreationPlaylist.py || (echo "❌ Code formatting issues found. Run 'black src/ tests/ CreationPlaylist.py' to fix." && exit 1)

      - name: Run Ruff (linting)
        run: |
          ruff check src/ tests/ CreationPlaylist.py --output-format=github || (echo "❌ Ruff found linting issues. Run 'ruff check --fix src/ tests/ CreationPlaylist.py' to see details." && exit 1)

      - name: Run MyPy (type checking)
        run: |
          mypy src/ || (echo "❌ MyPy found type checking issues. Run 'mypy src/' to see details. Check mypy.ini for configuration." && exit 1)

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install safety
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Run safety check
        run: |
          safety check --json --file requirements.txt || true
        continue-on-error: true

      - name: Run Bandit (security linting)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 30
        if: always()

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify application structure
        run: |
          python -c "import src; print('✅ src package importable')"
          python -c "import src.services; print('✅ services package importable')"
          python -c "import src.models; print('✅ models package importable')"
          python -c "import src.logic; print('✅ logic package importable')"
          python -c "import src.utils; print('✅ utils package importable')"

      - name: Check configuration
        run: |
          python -c "from src.config import *; print('✅ Configuration importable')"

      - name: Check imports
        run: |
          python -c "from src.services.spotify_service import SpotifyService; print('✅ Import successful')"
          python -c "from src.models.audio_classifier import AudioClassifier; print('✅ Import successful')"
          python -c "from src.logic.playlist_generator import PlaylistPathfinder; print('✅ Import successful')"
          python -c "from src.services.spotify_service_async import AsyncSpotifyService; print('✅ Import successful')"

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [lint, test, security, build-check]
    if: always()

    steps:
      - name: Check job status
        run: |
          echo "All jobs completed"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build-check.result }}"
